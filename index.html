/* ============================= EVENT DELEGATION ============================= */
document.addEventListener('click', async (e) => {
  const backdrop = e.target.closest('.modal-backdrop');
  if (backdrop && e.target === backdrop){ closeModal(); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn || btn === backdrop) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;

  switch(action){
    case 'modal-close': closeModal(); break;
    case 'goto': selectTab(btn.dataset.tab); break;

    case 'habits-week': {
      uiState.habitsWeek = addDays(uiState.habitsWeek, 7 * Number(btn.dataset.dir));
      renderView(); break;
    }
    case 'habit-add': modalHabit(); break;
    case 'habit-edit': modalHabit(Store.habits.find(h=>h.id===id)); break;
    case 'habit-toggle': {
      const habitId = btn.dataset.habit, date = btn.dataset.date;
      const docId = habitId + '_' + date;
      if (habitLogDone(habitId, date)) await Data.remove('habit_logs', docId);
      else await Data.setIn('habit_logs', docId, {habitId, date, done:true});
      break;
    }
    case 'habit-delete': await Data.remove('habits', id); break;

    case 'work-filter': uiState.workFilter = btn.dataset.filter; renderView(); break;
    case 'work-view': uiState.workView = btn.dataset.view; renderView(); break;
    case 'task-add': modalTask(); break;
    case 'task-edit': modalTask(Store.work_tasks.find(t=>t.id===id)); break;
    case 'task-delete': await Data.remove('work_tasks', id); break;
    case 'task-timer-start': await Data.update('work_tasks', id, {timerStartedAt: Date.now()}); break;
    case 'task-timer-stop': {
      const t = Store.work_tasks.find(x=>x.id===id);
      if (t && t.timerStartedAt){
        const elapsedH = (Date.now() - t.timerStartedAt) / 3600000;
        const newHours = Math.round(((Number(t.hours)||0) + elapsedH) * 100) / 100;
        await Data.update('work_tasks', id, {hours: newHours, timerStartedAt: null});
      }
      break;
    }
    case 'task-move': {
      const t = Store.work_tasks.find(x=>x.id===id);
      if (!t) break;
      const order = ['todo','doing','done'];
      const idx = order.indexOf(t.status||'todo');
      const dir = Number(btn.dataset.dir);
      const next = order[Math.min(order.length-1, Math.max(0, idx+dir))];
      const data = {status: next};
      if (next==='done' && t.status!=='done') data.completedDate = todayISO();
      else if (next!=='done') data.completedDate = null;
      await Data.update('work_tasks', id, data);
      break;
    }
    case 'report-copy': {
      const text = reportText(weeklyReport(startOfWeek(todayISO())));
      try{
        await navigator.clipboard.writeText(text);
        toast('Report copied — paste it anywhere.');
      }catch(e){
        toast("Couldn't copy automatically — select and copy the report manually.", 'error');
      }
      break;
    }

    case 'goal-add': modalGoal(); break;
    case 'goal-edit': modalGoal(Store.goals.find(g=>g.id===id)); break;
    case 'goal-delete': await Data.remove('goals', id); break;
    case 'goal-steps': modalGoalSteps(Store.goals.find(g=>g.id===id)); break;

    case 'trip-add': modalTrip(); break;
    case 'trip-edit': modalTrip(Store.trips.find(t=>t.id===id)); break;
    case 'trip-delete': await Data.remove('trips', id); break;
    case 'trip-itinerary': modalItinerary(id); break;
    case 'checklist-templates': modalChecklistTemplates(); break;
    case 'grocery-add': modalGroceryItem(); break;
    case 'grocery-bought': modalGroceryBought(Store.grocery_items.find(x=>x.id===id)); break;
    case 'grocery-edit': modalGroceryItem(Store.grocery_items.find(x=>x.id===id)); break;
    case 'grocery-delete': await Data.remove('grocery_items', id); break;
    case 'grocery-relist': await Data.update('grocery_items', id, {onList: true}); break;
    case 'template-edit': modalTemplateEdit(Store.checklist_templates.find(x=>x.id===id)); break;
    case 'template-delete': await Data.remove('checklist_templates', id); modalChecklistTemplates(); break;
    case 'template-starter': {
      const kind = btn.dataset.kind;
      const starters = {
        international: {name:'International trip starter', items:['Check passport validity (6+ months)','Book flights','Reserve hotel','Travel insurance','Check visa requirements','Notify bank of travel','Download offline maps','Pack universal adapter','Photocopy/scan travel documents']},
        weekend: {name:'Weekend trip starter', items:['Book accommodation','Plan transportation','Check weather forecast','Pack essentials','Set out-of-office / notify work','Charge devices & pack chargers']},
      };
      const tpl = starters[kind];
      if (tpl) await Data.add('checklist_templates', tpl);
      modalChecklistTemplates();
      break;
    }
    case 'itinerary-delete': {
      const tripId = btn.dataset.trip, entryId = btn.dataset.entry;
      const trip = Store.trips.find(t=>t.id===tripId);
      if (trip){
        await Data.update('trips', tripId, {itinerary: (trip.itinerary||[]).filter(en=>en.id!==entryId)});
        modalItinerary(tripId);
      }
      break;
    }
    case 'ai-suggest': await aiTripIdeas(btn.dataset.id); break;
    case 'ai-add-suggestion': {
      const tripId = btn.dataset.trip;
      const trip = Store.trips.find(t=>t.id===tripId);
      if (trip){
        const entry = {id: uid(), day:'', time:'', title: btn.dataset.name, category: btn.dataset.cat, cost: Number(btn.dataset.cost)||0, notes: btn.dataset.desc};
        await Data.update('trips', tripId, {itinerary: [...(trip.itinerary||[]), entry]});
        toast('Added to itinerary.');
        btn.closest('div').style.opacity = '0.4';
        btn.disabled = true;
      }
      break;
    }

    case 'cat-add': modalCategory(); break;
    case 'cat-edit': modalCategory(Store.budget_categories.find(c=>c.id===id)); break;
    case 'cat-checklist': modalCategoryChecklist(Store.budget_categories.find(c=>c.id===id)); break;
    case 'cat-delete': await Data.remove('budget_categories', id); break;
    case 'goal-edit-btn': modalBudgetGoal(uiState.budgetMonth); break;
    case 'expense-add': modalExpense(); break;
    case 'expense-delete': await Data.remove('budget_expenses', id); break;
    case 'expense-csv': await exportBudgetCSV(); break;
    case 'scan-receipt': $('#receiptFile').click(); break;
    case 'recurring-manage': modalRecurring(); break;
    case 'recurring-delete': await Data.remove('budget_recurring', id); modalRecurring(); break;
    case 'recurring-apply': {
      const ym = uiState.budgetMonth;
      const pend = pendingRecurring(ym);
      for (const r of pend){
        await Data.add('budget_expenses', {categoryId: r.categoryId, categoryName: r.categoryName, amount: Number(r.amount)||0, date: todayISO(), note: r.note || '(recurring)'});
        await Data.update('budget_recurring', r.id, {loggedMonths: [...(r.loggedMonths||[]), ym]});
      }
      toast(`Added ${pend.length} recurring expense${pend.length===1?'':'s'}.`);
      break;
    }

    case 'bill-add': modalBill(); break;
    case 'bill-edit': modalBill(Store.bills.find(x=>x.id===id)); break;
    case 'bill-delete': await Data.remove('bills', id); break;
    case 'bill-pay': modalBillPay(Store.bills.find(x=>x.id===id)); break;
    case 'reminder-bills-dismiss':
      try{ localStorage.setItem(BILLS_DISMISS_KEY, todayISO()); }catch(e){}
      BannerState.bills = ''; renderBanners();
      break;

    case 'medical-member': uiState.medicalMember = btn.dataset.member; renderView(); break;
    case 'member-add': modalFamilyMember(); break;
    case 'member-edit': modalFamilyMember(Store.family_members.find(x=>x.id===id)); break;
    case 'member-delete': await Data.remove('family_members', id); break;
    case 'mtask-add': modalMedTask(); break;
    case 'mtask-edit': modalMedTask(Store.medical_tasks.find(x=>x.id===id)); break;
    case 'mtask-delete': await Data.remove('medical_tasks', id); break;
    case 'mtask-done': await Data.update('medical_tasks', id, {status:'done', completedDate: todayISO()}); break;
    case 'mlog-add': modalMedLog(); break;
    case 'mlog-edit': modalMedLog(Store.medical_logs.find(x=>x.id===id)); break;
    case 'mlog-delete': await Data.remove('medical_logs', id); break;
    case 'med-add': modalMedication(); break;
    case 'med-edit': modalMedication(Store.medications.find(x=>x.id===id)); break;
    case 'med-delete': await Data.remove('medications', id); break;
    case 'med-dose': modalMedDose(Store.medications.find(x=>x.id===id)); break;
    case 'rx-view': { const med = Store.medications.find(x=>x.id===id); if (med && med.prescriptionPhoto) modalRxView(med); break; }
    case 'rx-remove': {
      await Data.update('medications', id, {prescriptionPhoto: null});
      modalMedication(Store.medications.find(x=>x.id===id));
      break;
    }

    case 'retire-settings': modalRetireSettings(); break;
    case 'portfolio-update': modalPortfolioUpdate(); break;
    case 'contribution-add': modalContribution(); break;
    case 'contribution-delete': await Data.remove('retirement_contributions', id); break;

    case 'reminder-export': await exportData(); break;
    case 'backup-history': await modalBackupHistory(); break;
    case 'import-confirm': {
      if (!pendingImport){ closeModal(); break; }
      await localSave(pendingImport);
      pendingImport = null;
      localFire();
      closeModal();
      toast('Backup restored.');
      break;
    }
    case 'custom-theme-edit': openModal(modalCustomTheme()); break;
    case 'custom-theme-remove': {
      await Data.setDoc('settings/customTheme', {name:'', image:''});
      if (document.documentElement.dataset.appTheme === 'custom') applyAppTheme('glass');
      toast('Custom background removed.');
      closeModal();
      break;
    }
    case 'snapshot-restore': {
      if (pendingRestoreKey !== btn.dataset.key){
        pendingRestoreKey = btn.dataset.key;
        btn.textContent = 'Really restore? Tap again';
        btn.classList.add('danger');
        break;
      }
      pendingRestoreKey = null;
      const ok = await restoreSnapshot(btn.dataset.key);
      toast(ok ? 'Snapshot restored.' : "Couldn't restore that snapshot.", ok?undefined:'error');
      closeModal();
      break;
    }
    case 'lock-settings': modalPinSettings(); break;
    case 'reminder-dismiss':
      try{ localStorage.setItem(DISMISS_KEY, todayISO()); }catch(e){}
      BannerState.backup = ''; renderBanners();
      break;
    case 'reminder-expense-add': modalExpense(); break;
    case 'reminder-expense-dismiss':
      try{ localStorage.setItem(EXPENSE_DISMISS_KEY, todayISO()); }catch(e){}
      BannerState.expense = ''; renderBanners();
      break;
  }
});

document.addEventListener('change', async (e) => {
  if (e.target.matches('[data-action="trip-check-toggle"]')){
    const trip = Store.trips.find(t => t.id === e.target.dataset.trip);
    if (!trip) return;
    const idx = Number(e.target.dataset.idx);
    const list = (trip.checklist || []).map((item,i) => i===idx ? {...item, done: e.target.checked} : item);
    await Data.update('trips', trip.id, {checklist: list});
    return;
  }
  if (e.target.matches('[data-action="budget-month"]')){
    uiState.budgetMonth = e.target.value; renderView(); return;
  }
  if (e.target.matches('[data-action="template-apply-select"]')){
    const tplId = e.target.value;
    if (!tplId){ return; }
    const trip = Store.trips.find(t=>t.id===e.target.dataset.trip);
    const tpl = Store.checklist_templates.find(x=>x.id===tplId);
    e.target.value = '';
    if (!trip || !tpl) return;
    const existing = new Set((trip.checklist||[]).map(i=>i.text));
    const added = (tpl.items||[]).filter(text => !existing.has(text)).map(text => ({text, done:false}));
    if (added.length) await Data.update('trips', trip.id, {checklist: [...(trip.checklist||[]), ...added]});
    toast(added.length ? `Added ${added.length} item${added.length===1?'':'s'} from "${tpl.name}"` : `"${tpl.name}" items already on this trip's checklist`);
    return;
  }
  if (e.target.matches('[data-action="heatmap-habit"]')){
    uiState.heatmapHabit = e.target.value; renderView(); return;
  }
  if (e.target.matches('[data-action="backlog-weeks"]')){
    const n = Math.max(1, Math.min(12, Number(e.target.value)||2));
    uiState.workBacklogWeeks = n; renderView(); return;
  }
  if (e.target.matches('[data-action="goal-check-toggle"]')){
    const goal = Store.goals.find(g => g.id === e.target.dataset.goal);
    if (!goal) return;
    const idx = Number(e.target.dataset.idx);
    const list = (goal.checklist || []).map((item,i) => i===idx ? {...item, done: e.target.checked} : item);
    await Data.update('goals', goal.id, {checklist: list});
    modalGoalSteps(Store.goals.find(g => g.id === goal.id));
    return;
  }
  if (e.target.matches('[data-action="cat-check-toggle"]')){
    const cat = Store.budget_categories.find(c => c.id === e.target.dataset.cat);
    if (!cat) return;
    const idx = Number(e.target.dataset.idx);
    const list = (cat.checklist || []).map((item,i) => i===idx ? {...item, done: e.target.checked} : item);
    await Data.update('budget_categories', cat.id, {checklist: list});
    const fresh = Store.budget_categories.find(c => c.id === cat.id);
    modalCategoryChecklist(fresh);
    return;
  }
});

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  // Guard against a rapid double-submit (e.g. a fast double-click, or two "submit" events firing
  // in the same tick) creating duplicate records — the whole handler below is async, so without
  // this a second submit can start before the first one's Data.add() has finished.
  if (form.dataset.submitting === '1') return;
  form.dataset.submitting = '1';
  try{
  const fd = new FormData(form);
  const val = k => fd.get(k);
  const name = form.dataset.form;

  // A required text input only blocks native submission for being empty, not for being
  // whitespace-only — "   " passes HTML's required check and used to save as a nameless,
  // unlabeled row. Reject it the same way an actually-empty value would be.
  const REQUIRED_PRIMARY_FIELD = {
    'habit-save':'name', 'task-save':'title', 'goal-save':'title', 'trip-save':'name',
    'template-save':'name', 'grocery-save':'name', 'cat-save':'name', 'bill-save':'name',
    'member-save':'name', 'mtask-save':'title', 'mlog-save':'title', 'med-save':'name',
    'itinerary-add':'title',
  };
  const primaryField = REQUIRED_PRIMARY_FIELD[name];
  if (primaryField && !String(val(primaryField)||'').trim()){
    toast("That field can't be blank or just spaces.", 'error');
    return;
  }

  if (name === 'habit-save'){
    const schedType = val('schedType') || 'daily';
    let schedule = {type:'daily'};
    if (schedType === 'weekly'){
      const days = (val('schedDays')||'').split(',').filter(x=>x!=='').map(Number);
      schedule = {type:'weekly', days};
    } else if (schedType === 'timesPerWeek'){
      schedule = {type:'timesPerWeek', target: Math.max(1, Math.min(7, Number(val('schedTarget'))||3))};
    }
    const data = {name: val('name'), schedule};
    if (form.dataset.id) await Data.update('habits', form.dataset.id, data);
    else await Data.add('habits', {...data, createdAt: Date.now()});
  } else if (name === 'task-save'){
    const status = val('status');
    const data = {title: val('title'), date: val('date')||todayISO(), priority: val('priority')||'medium', status, hours: Number(val('hours'))||0};
    if (form.dataset.id){
      const prev = Store.work_tasks.find(t=>t.id===form.dataset.id);
      if (status==='done' && prev && prev.status!=='done') data.completedDate = todayISO();
      else if (status!=='done') data.completedDate = null;
      await Data.update('work_tasks', form.dataset.id, data);
    } else {
      data.createdDate = todayISO();
      if (status==='done') data.completedDate = todayISO();
      await Data.add('work_tasks', data);
    }
  } else if (name === 'goal-save'){
    const data = {title: val('title'), targetDate: val('targetDate')||'', status: val('status'), notes: val('notes')||''};
    if (form.dataset.id) await Data.update('goals', form.dataset.id, data);
    else await Data.add('goals', data);
  } else if (name === 'trip-save'){
    const startDate = val('startDate')||'', endDate = val('endDate')||'';
    if (startDate && endDate && endDate < startDate){
      toast('End date is before the start date — check the trip dates.', 'error');
      return;
    }
    const prev = form.dataset.id ? Store.trips.find(t=>t.id===form.dataset.id) : null;
    const prevMap = {}; (prev && prev.checklist || []).forEach(i => { prevMap[i.text] = i.done; });
    const lines = String(val('checklist')||'').split('\n').map(s=>s.trim()).filter(Boolean);
    const checklist = lines.map(text => ({text, done: !!prevMap[text]}));
    const data = {
      name: val('name'), destination: val('destination')||'',
      startDate: val('startDate')||'', endDate: val('endDate')||'',
      budget: numVal(val('budget')), status: val('status'), checklist,
      itinerary: prev ? (prev.itinerary || []) : [],
    };
    if (form.dataset.id) await Data.update('trips', form.dataset.id, data);
    else await Data.add('trips', data);
  } else if (name === 'template-save'){
    const items = String(val('items')||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if (form.dataset.id) await Data.update('checklist_templates', form.dataset.id, {name: val('name'), items});
    else await Data.add('checklist_templates', {name: val('name'), items});
    modalChecklistTemplates();
    return;
  } else if (name === 'grocery-save'){
    const data = {name: val('name'), note: val('note')||''};
    if (form.dataset.id) await Data.update('grocery_items', form.dataset.id, data);
    else await Data.add('grocery_items', {...data, onList: true, lastBought: null, boughtCount: 0, purchaseLog: []});
  } else if (name === 'grocery-bought-save'){
    const item = Store.grocery_items.find(x => x.id === form.dataset.id);
    if (!item){ closeModal(); return; }
    const date = val('date') || todayISO();
    const price = numVal(val('price'));
    const purchaseLog = [...(item.purchaseLog||[]), date].slice(-12);
    await Data.update('grocery_items', item.id, {
      onList: false, lastBought: date, lastPrice: price || item.lastPrice || null,
      boughtCount: (item.boughtCount||0) + 1, purchaseLog,
    });
    const categoryId = val('categoryId');
    if (price > 0 && categoryId){
      const cat = Store.budget_categories.find(c => c.id === categoryId);
      await Data.add('budget_expenses', {
        categoryId, categoryName: cat ? cat.name : '(deleted category)',
        amount: price, date, note: item.name,
      });
      toast(`${item.name} marked bought — ${PHP(price)} logged to ${cat?cat.name:'budget'}.`);
    } else {
      toast(`${item.name} marked bought — you'll see this date next time.`);
    }
  } else if (name === 'receipt-confirm'){
    const rowCount = Number(val('rowCount'))||0;
    const date = val('date') || todayISO();
    let count = 0, total = 0;
    for (let idx=0; idx<rowCount; idx++){
      if (!val(`inc_${idx}`)) continue;
      const nm = (val(`name_${idx}`)||'').trim();
      const cost = numVal(val(`cost_${idx}`));
      if (!nm || !cost) continue;
      const catId = val(`cat_${idx}`) || '';
      const cat = Store.budget_categories.find(c => c.id === catId);
      await Data.add('budget_expenses', {categoryId: catId, categoryName: cat?cat.name:'(uncategorized)', amount: cost, date, note: nm});
      count++; total += cost;
    }
    toast(count ? `Added ${count} expense${count===1?'':'s'} (${PHP(total)}) from your receipt.` : 'Nothing added — check at least one item with a price.');
  } else if (name === 'cat-save'){
    const icon = val('icon') || '';
    const rollover = !!val('rollover');
    if (form.dataset.id) await Data.update('budget_categories', form.dataset.id, {name: val('name'), allocation: numVal(val('allocation')), icon, rollover});
    else await Data.add('budget_categories', {name: val('name'), allocation: numVal(val('allocation')), icon, rollover, checklist: []});
  } else if (name === 'expense-save'){
    const cat = Store.budget_categories.find(c => c.id === val('categoryId'));
    await Data.add('budget_expenses', {
      categoryId: val('categoryId'), categoryName: cat ? cat.name : '(deleted category)',
      amount: numVal(val('amount')), date: val('date')||todayISO(), note: val('note')||'',
    });
  } else if (name === 'goal-steps-save'){
    const goalId = form.dataset.id;
    const goal = Store.goals.find(g=>g.id===goalId);
    const prevMap = {}; (goal && goal.checklist || []).forEach(i => { prevMap[i.text] = i.done; });
    const lines = String(val('steps')||'').split('\n').map(s=>s.trim()).filter(Boolean);
    const checklist = lines.map(text => ({text, done: !!prevMap[text]}));
    await Data.update('goals', goalId, {checklist});
    modalGoalSteps(Store.goals.find(g=>g.id===goalId));
    return;
  } else if (name === 'pin-enable'){
    const pin = val('pin'), pin2 = val('pin2');
    if (!/^\d{4,6}$/.test(pin)){ toast('PIN must be 4–6 digits.', 'error'); return; }
    if (pin !== pin2){ toast("PINs don't match.", 'error'); return; }
    await setPin(pin);
    toast('PIN lock turned on.');
  } else if (name === 'pin-disable'){
    const ok = await verifyPin(val('pin'));
    if (!ok){ toast('Incorrect PIN.', 'error'); return; }
    disablePin();
    toast('PIN lock turned off.');
  } else if (name === 'recurring-save'){
    const cat = Store.budget_categories.find(c => c.id === val('categoryId'));
    await Data.add('budget_recurring', {categoryId: val('categoryId'), categoryName: cat?cat.name:'', amount: numVal(val('amount')), note: val('note')||'', loggedMonths: []});
    modalRecurring();
    return;
  } else if (name === 'budget-goal-save'){
    const ym = form.dataset.ym;
    await Data.setIn('budget_goals', ym, {ym, amount: numVal(val('amount'))});
  } else if (name === 'retire-save'){
    const currentAge = Number(val('currentAge'))||0, retireAge = Number(val('retireAge'))||0;
    if (retireAge <= currentAge){
      toast('Target retirement age must be after your current age.', 'error');
      return;
    }
    await Data.setDoc('retirement/settings', {
      ...(Store.retirement_settings||{}),
      currentAge, retireAge,
      monthlyExpense: numVal(val('monthlyExpense')), currentSavings: numVal(val('currentSavings')),
      inflation: Number(val('inflation'))||0, returnRate: Number(val('returnRate'))||0,
    });
  } else if (name === 'portfolio-save'){
    await Data.setDoc('retirement/settings', {
      ...(Store.retirement_settings||{}),
      portfolioToDate: numVal(val('portfolioToDate')), portfolioAsOf: val('portfolioAsOf')||todayISO(),
    });
  } else if (name === 'contribution-save'){
    await Data.add('retirement_contributions', {
      amount: numVal(val('amount')), date: val('date')||todayISO(), vehicle: val('vehicle'), note: val('note')||'',
    });
  } else if (name === 'category-checklist-save'){
    const catId = form.dataset.id;
    const cat = Store.budget_categories.find(c=>c.id===catId);
    const prevMap = {}; (cat && cat.checklist || []).forEach(i => { prevMap[i.text] = i.done; });
    const lines = String(val('items')||'').split('\n').map(s=>s.trim()).filter(Boolean);
    const checklist = lines.map(text => ({text, done: !!prevMap[text]}));
    await Data.update('budget_categories', catId, {checklist});
  } else if (name === 'itinerary-add'){
    const tripId = form.dataset.id;
    const trip = Store.trips.find(t=>t.id===tripId);
    const entry = {id: uid(), day: val('day')||'', time: val('time')||'', title: val('title'),
      category: val('category'), cost: numVal(val('cost')), notes: val('notes')||''};
    const itinerary = [...(trip.itinerary||[]), entry];
    await Data.update('trips', tripId, {itinerary});
    form.reset();
    modalItinerary(tripId);
    return;
  } else if (name === 'bill-save'){
    const isFixed = !!val('isFixed');
    const data = {
      name: val('name'), category: val('category')||'Other', dueDay: Math.min(31, Math.max(1, Number(val('dueDay'))||1)),
      amountType: isFixed ? 'fixed' : 'variable', fixedAmount: isFixed ? numVal(val('fixedAmount')) : 0,
      notes: val('notes')||'',
    };
    if (form.dataset.id) await Data.update('bills', form.dataset.id, data);
    else await Data.add('bills', {...data, createdAt: Date.now()});
  } else if (name === 'bill-pay-save'){
    const billId = form.dataset.id, ym = form.dataset.ym, dueDate = form.dataset.due;
    const amount = numVal(val('amount'));
    const paidDate = val('paidDate') || todayISO();
    const existing = billPaymentFor(billId, ym);
    if (existing) await Data.update('bill_payments', existing.id, {amount, paidDate, dueDate});
    else await Data.add('bill_payments', {billId, ym, dueDate, amount, paidDate});
    const bill = Store.bills.find(b=>b.id===billId);
    toast(`${bill?bill.name:'Bill'} marked paid — ${PHP(amount)}.`);
  } else if (name === 'member-save'){
    const data = {name: val('name'), relationship: val('relationship')||'', notes: val('notes')||''};
    if (form.dataset.id) await Data.update('family_members', form.dataset.id, data);
    else await Data.add('family_members', {...data, createdAt: Date.now()});
  } else if (name === 'mtask-save'){
    const data = {memberId: val('memberId'), title: val('title'), type: val('type')||'other', scheduledDate: val('scheduledDate')||'', notes: val('notes')||''};
    if (form.dataset.id) await Data.update('medical_tasks', form.dataset.id, data);
    else await Data.add('medical_tasks', {...data, status:'upcoming'});
  } else if (name === 'mlog-save'){
    const resolved = !!val('resolved');
    const data = {memberId: val('memberId'), title: val('title'), date: val('date')||todayISO(), symptoms: val('symptoms')||'', notes: val('notes')||'', resolved};
    if (form.dataset.id){
      const prev = Store.medical_logs.find(l=>l.id===form.dataset.id);
      if (resolved && prev && !prev.resolved) data.resolvedDate = todayISO();
      else if (!resolved) data.resolvedDate = null;
      await Data.update('medical_logs', form.dataset.id, data);
    } else {
      if (resolved) data.resolvedDate = todayISO();
      await Data.add('medical_logs', data);
    }
  } else if (name === 'med-save'){
    const isAntibiotic = !!val('isAntibiotic');
    const data = {
      memberId: val('memberId'), name: val('name'), dosage: val('dosage')||'',
      isAntibiotic, courseStartDate: isAntibiotic ? (val('courseStartDate')||todayISO()) : '',
      courseDays: isAntibiotic ? (Number(val('courseDays'))||0) : 0,
      status: val('status')||'active', notes: val('notes')||'',
    };
    const fileInput = form.querySelector('#rxPhotoInput');
    if (fileInput && fileInput.files && fileInput.files[0]){
      try{ data.prescriptionPhoto = await compressImageFile(fileInput.files[0]); }
      catch(e){ toast("Couldn't read that photo — saved without it.", 'error'); }
    }
    if (form.dataset.id) await Data.update('medications', form.dataset.id, data);
    else await Data.add('medications', {...data, lastTaken: null, timesTaken: 0, doseLog: []});
  } else if (name === 'med-dose-save'){
    const med = Store.medications.find(x => x.id === form.dataset.id);
    if (!med){ closeModal(); return; }
    const date = val('date') || todayISO();
    const doseLog = [...(med.doseLog||[]), date].slice(-30);
    await Data.update('medications', med.id, {lastTaken: date, timesTaken: (med.timesTaken||0)+1, doseLog});
    toast(`${med.name} dose logged for ${fmtDate(date)}.`);
  } else if (name === 'custom-theme-save'){
    const fileInput = form.querySelector('#customBgInput');
    const file = fileInput && fileInput.files && fileInput.files[0];
    const data = {name: (val('name')||'').trim()};
    if (file){
      try{ data.image = await compressImageFile(file, 1600, 0.75); }
      catch(e){ toast("Couldn't read that photo — try a different one.", 'error'); closeModal(); return; }
    } else if (Store.custom_theme && Store.custom_theme.image){
      data.image = Store.custom_theme.image;
    } else {
      toast('Choose a photo first.', 'error'); return;
    }
    await Data.setDoc('settings/customTheme', data);
    applyAppTheme('custom');
    toast('Background updated.');
  }
  closeModal();
  }finally{
    form.dataset.submitting = '';
  }
});

/* ============================= APP THEME (Ledger / Glass / Midnight / Custom) ============================= */
const THEME_KEY = 'trellis_app_theme';
const CUSTOM_BG_FALLBACK = 'linear-gradient(155deg, #d9f0e6 0%, #cfe6f5 38%, #e9dcf5 72%, #ffe6ef 100%)';
function applyCustomBg(){
  const ct = Store.custom_theme;
  const grad = ct && ct.image ? `url("${ct.image}") center/cover no-repeat fixed` : CUSTOM_BG_FALLBACK;
  document.documentElement.style.setProperty('--page-grad', grad);
}
function refreshCustomThemeUI(){
  const btn = $('#customThemeBtn'); if (!btn) return;
  const swatch = $('#customThemeSwatch'), label = $('#customThemeLabel'), editBtn = $('#customThemeEditBtn');
  const ct = Store.custom_theme;
  const has = !!(ct && ct.image);
  btn.dataset.configured = has ? '1' : '0';
  if (label) label.textContent = has ? (ct.name || 'Photo') : 'Photo';
  if (swatch){
    swatch.classList.toggle('has-photo', has);
    swatch.style.backgroundImage = has ? `url("${ct.image}")` : '';
  }
  if (editBtn) editBtn.style.display = has ? '' : 'none';
  if (document.documentElement.dataset.appTheme === 'custom') applyCustomBg();
}
function applyAppTheme(name){
  document.documentElement.dataset.appTheme = name;
  try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
  $$('#themeSwitch [data-theme-choice]').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === name));
  // The uploaded photo is applied as an inline --page-grad override, which (being inline)
  // would otherwise outrank Glass's and Midnight's own stylesheet gradients once set — so it
  // must be cleared whenever any theme other than Photo is active, leaving their own untouched.
  if (name === 'custom') applyCustomBg();
  else document.documentElement.style.removeProperty('--page-grad');
}
function initAppTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyAppTheme(['ledger', 'glass', 'glass-dark', 'custom'].includes(saved) ? saved : 'glass');
  $$('#themeSwitch [data-theme-choice]').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.themeChoice === 'custom' && b.dataset.configured !== '1'){ openModal(modalCustomTheme()); return; }
      applyAppTheme(b.dataset.themeChoice);
    });
  });
}
function modalCustomTheme(){
  const ct = Store.custom_theme;
  const has = !!(ct && ct.image);
  return `<h3>Custom background photo</h3>
  <p style="font-size:12px; color:var(--muted); margin:-4px 0 12px;">Pick any photo — it becomes the background, with every card and table floating above it. Give it a name and it shows up as your own theme in the switcher. Stored only on this device, like everything else.</p>
  <form data-form="custom-theme-save">
    ${has ? `<div style="width:100%; aspect-ratio:16/7; border-radius:var(--radius-sm); background:url('${ct.image}') center/cover; margin-bottom:12px; border:1px solid var(--line);"></div>` : ''}
    <div class="field"><label>Photo</label><input type="file" accept="image/*" id="customBgInput" ${has?'':'required'}></div>
    <div class="field"><label>Theme name</label><input type="text" name="name" placeholder="e.g. Sakura, Beach Day, Golden Hour" value="${escapeHtml((ct&&ct.name)||'')}" maxlength="30"></div>
    <div class="modal-actions" style="justify-content:space-between;">
      ${has ? `<button type="button" class="btn small secondary" data-action="custom-theme-remove">Remove photo</button>` : '<span></span>'}
      <span style="display:flex; gap:8px;">
        <button type="button" class="btn small secondary" data-action="modal-close">Cancel</button>
        <button type="submit" class="btn small">${has?'Save changes':'Save & use'}</button>
      </span>
    </div>
  </form>`;
}

/* ============================= BOOT ============================= */
async function boot(){
  initLock();
  initAppTheme();
  await Data.init();
  $('#sidebarFoot').textContent = 'Saved on this phone/browser only.';
  wireBackup();

  const collections = [
    ['habits', d => Store.habits = d.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))],
    ['habit_logs', d => Store.habit_logs = d],
    ['work_tasks', d => Store.work_tasks = d],
    ['goals', d => Store.goals = d],
    ['trips', d => Store.trips = d],
    ['checklist_templates', d => Store.checklist_templates = d],
    ['grocery_items', d => Store.grocery_items = d.sort((a,b)=>(a.name||'').localeCompare(b.name||''))],
    ['family_members', d => Store.family_members = d.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))],
    ['medical_tasks', d => Store.medical_tasks = d],
    ['medical_logs', d => Store.medical_logs = d],
    ['medications', d => Store.medications = d],
    ['bills', d => { Store.bills = d.sort((a,b)=>(a.name||'').localeCompare(b.name||'')); maybeShowBillReminder(); }],
    ['bill_payments', d => { Store.bill_payments = d; maybeShowBillReminder(); }],
    ['budget_categories', d => Store.budget_categories = d],
    ['budget_expenses', d => { Store.budget_expenses = d; maybeShowExpenseReminder(); }],
    ['budget_goals', d => Store.budget_goals = d],
    ['budget_recurring', d => Store.budget_recurring = d],
    ['retirement_contributions', d => Store.retirement_contributions = d],
  ];
  collections.forEach(([col, setter]) => {
    Data.subscribe(col, docs => { setter(docs); renderView(); });
  });
  Data.subscribeDoc('retirement/settings', doc => { Store.retirement_settings = doc; renderView(); });
  Data.subscribeDoc('settings/customTheme', doc => { Store.custom_theme = doc; refreshCustomThemeUI(); });

  renderNav();
  renderView();
  maybeShowBackupReminder();
  maybeShowExpenseReminder();
  maybeShowBillReminder();

  setInterval(() => {
    if (currentTab !== 'work') return;
    const live = $$('.timer-live');
    if (!live.length) return;
    live.forEach(el => { el.textContent = '+' + fmtElapsed(Date.now() - Number(el.dataset.started)); });
  }, 1000);
}
boot();
</script>

</body></html>
